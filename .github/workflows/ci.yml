name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm test
      - run: swiftc -parse-as-library -typecheck menubar.swift workflow.swift project-artifact-export.swift
      - run: npm pack && npm install -g ./miguelpieras-claude-transplant-*.tgz && claude-transplant-resume --version && claude-transplant-resume --help
        env:
          npm_config_min_release_age: 7
