name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: swiftc -parse-as-library -typecheck menubar.swift workflow.swift
      - run: npm pack && npm install -g ./miguelpieras-claude-transplant-*.tgz && claude-transplant-resume --version && claude-transplant-resume --help
        env:
          npm_config_min_release_age: 7
